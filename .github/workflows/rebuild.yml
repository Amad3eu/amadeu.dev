# Refaz o deploy todo dia para atualizar o gráfico de contribuições do GitHub.
# Configure o secret VERCEL_DEPLOY_HOOK (Vercel > Project > Settings > Git > Deploy Hooks).
name: Daily rebuild

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK não configurado, pulando."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
